[workspace]
resolver = "2"
members = [
    "crates/router-core",
    "crates/buzz-router",
    "crates/test-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

# Versions follow design section 3.2. Unless noted there, they are the versions Buzz's workspace
# pins at the reference commit. A crate lists only the dependencies it uses, with `workspace = true`.
[workspace.dependencies]
# Buzz, pinned to the reference commit (AGENTS.md). Never modified.
buzz-core = { git = "https://github.com/block/buzz", rev = "f0eb5575ffc9d5f57af4ed3f574529d997c83a0d" }
buzz-sdk = { git = "https://github.com/block/buzz", rev = "f0eb5575ffc9d5f57af4ed3f574529d997c83a0d" }
nostr = "0.45"

# Async runtime, WebSocket, HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "process"] }
tokio-util = "0.7"
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
axum = "0.8"

# Storage and keys. See the keyring comment in crates/buzz-router/Cargo.toml: `keyring` 4.x
# provides the platform stores (feature `v1`) and `keyring-core` provides `Entry` and the mock store.
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = { version = "4", default-features = false, features = ["v1"] }
keyring-core = "1"

# Processes
command-group = { version = "5.0.1", features = ["with-tokio"] }
nix = { version = "0.31", features = ["signal", "process"] }

# Time, serialization, text
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
regex = "1"

# CLI, logging, paths
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
directories = "6"

# Crypto, encoding, identifiers
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
subtle = "2.6"
getrandom = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

# Errors and tests
thiserror = "2"
anyhow = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
