name: CI

"on":
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  security:
    name: Security
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read

  lint:
    name: Lint (fmt)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check formatting
        run: cargo fmt --all --check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      - name: Release build
        run: cargo build --release --locked -p buzz-router --bin buzz-router

      - name: Ensure router-core is tokio-free
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          out="$(cargo tree -p router-core -e normal -i tokio 2>/dev/null || true)"
          if [ -n "$out" ]; then
            echo "router-core depends on tokio, which is forbidden:" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "router-core is tokio-free."

      - name: Ensure no openssl-sys dependency
        shell: bash
        run: |
          set -euo pipefail
          out="$(cargo tree -p buzz-router -e normal -i openssl-sys 2>/dev/null || true)"
          if [ -n "$out" ]; then
            echo "buzz-router depends on openssl-sys, but TLS must be rustls-only (R58.2):" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "no openssl-sys in buzz-router's normal dependency closure."

      - name: Ensure SQLite is bundled
        shell: bash
        run: |
          set -euo pipefail
          out="$(cargo tree -p buzz-router -e features -i libsqlite3-sys 2>/dev/null || true)"
          if ! printf '%s\n' "$out" | grep -q 'feature "bundled"'; then
            echo "libsqlite3-sys is missing the bundled feature (R58.2):" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "libsqlite3-sys is bundled."

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # Linux only (design DA-1): the macOS and Windows runners have no Linux container
    # engine for the local Buzz relay, so those legs could never pass.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    env:
      BUZZ_E2E_RELAY_URL: ws://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the tests
        run: cargo test -p buzz-router --locked --test 'e2e_*' --no-run

      # Checks out Buzz at the pinned rev, runs `docker compose up -d postgres redis`,
      # migrates, and runs buzz-relay with `.env.example` plus the task 2.9 test-identity
      # auth settings. The published image for the pinned rev is used when available;
      # otherwise the relay is built from the checkout.
      - name: Start the local Buzz relay
        shell: bash
        run: |
          set -euo pipefail
          if ! scripts/e2e-relay.sh up; then
            scripts/e2e-relay.sh down || true
            scripts/e2e-relay.sh up --build
          fi

      - name: End-to-end tests
        shell: bash
        run: BUZZ_E2E=1 cargo test -p buzz-router --locked --test 'e2e_*' -- --ignored --test-threads=1

      - name: Relay log
        if: failure()
        shell: bash
        run: scripts/e2e-relay.sh logs || true

      - name: Stop the local Buzz relay
        if: always()
        shell: bash
        run: scripts/e2e-relay.sh down || true

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal

      - name: Check with Rust 1.88
        run: cargo +1.88 check --workspace --locked

  # Installs a freshly built binary through the real installers, against a local
  # fake release laid out like a GitHub release. Catches installer breakage before
  # a release is cut, on all three operating systems.
  installers:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Shellcheck and version-script self-test
        if: runner.os == 'Linux'
        run: |
          shellcheck scripts/*.sh
          bash scripts/next-release-version.sh --self-test

      - name: Build
        run: cargo build --locked -p buzz-router --bin buzz-router

      - name: Install through install.sh
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          version="$(target/debug/buzz-router --version | awk '{print $2}')"
          fake="$RUNNER_TEMP/fake"
          mkdir -p "$fake/v$version"
          tar -czf "$fake/v$version/buzz-router-$version-${{ matrix.target }}.tar.gz" -C target/debug buzz-router
          (cd "$fake/v$version" && { sha256sum ./*.tar.gz 2>/dev/null || shasum -a 256 ./*.tar.gz; } | sed 's|\./||' > SHA256SUMS.txt)
          BUZZ_ROUTER_RELEASE_BASE="file://$fake" sh scripts/install.sh --version "$version" --install-dir "$RUNNER_TEMP/bin"
          test "$("$RUNNER_TEMP/bin/buzz-router" --version)" = "buzz-router $version"
          # A corrupted archive must be refused and must leave nothing behind.
          echo corrupt >> "$fake/v$version/buzz-router-$version-${{ matrix.target }}.tar.gz"
          if BUZZ_ROUTER_RELEASE_BASE="file://$fake" sh scripts/install.sh --version "$version" --install-dir "$RUNNER_TEMP/bin2"; then
            echo "installer accepted a corrupted archive" >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/bin2/buzz-router"

      - name: Install through install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = ((& target/debug/buzz-router.exe --version) -split ' ')[1]
          $fake = Join-Path $env:RUNNER_TEMP 'fake'
          $dir = Join-Path $fake "v$version"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = "buzz-router-$version-${{ matrix.target }}.zip"
          Compress-Archive -Path target/debug/buzz-router.exe -DestinationPath (Join-Path $dir $zip)
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $dir $zip)).Hash.ToLower()
          "$hash  $zip" | Set-Content -Path (Join-Path $dir 'SHA256SUMS.txt')
          $env:BUZZ_ROUTER_RELEASE_BASE = $fake
          $env:BUZZ_ROUTER_VERSION = $version
          $env:BUZZ_ROUTER_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin'
          ./scripts/install.ps1
          $got = & (Join-Path $env:BUZZ_ROUTER_INSTALL_DIR 'buzz-router.exe') --version
          if ($got -ne "buzz-router $version") { throw "unexpected version output: $got" }
          # A corrupted archive must be refused and must leave nothing behind.
          Add-Content -Path (Join-Path $dir $zip) -Value 'corrupt'
          $env:BUZZ_ROUTER_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin2'
          $refused = $false
          try { ./scripts/install.ps1 } catch { $refused = $true }
          if (-not $refused) { throw 'installer accepted a corrupted archive' }
          if (Test-Path (Join-Path $env:BUZZ_ROUTER_INSTALL_DIR 'buzz-router.exe')) { throw 'a corrupted install left a binary behind' }
