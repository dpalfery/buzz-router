# Release: cross-platform binaries and a GitHub Release.
#
# Actions -> Release -> Run workflow, on main. Only dpalfery may start it.
# Builds run immediately. Publishing waits on the `release` environment until a
# required reviewer clicks Review deployments on that same run.
#
#   "Make production release" unchecked  -> the next release candidate
#       (0.1.0-rc.1, then 0.1.0-rc.2, ...)
#   "Make production release" checked    -> promote that line to stable (0.1.0-rc.2 -> 0.1.0),
#       or, when the newest release is already stable, bump the patch (0.1.0 -> 0.1.1)
#
# scripts/next-release-version.sh picks the number from the v* tags on origin, so the
# run takes no version input. Minor and major cuts are a tag push:
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag is created by `gh release create --target <sha>` after approval, with
# GITHUB_TOKEN. No PAT is used. Hyphenated versions are published as pre-releases,
# which is why the installer skips them unless asked (--prerelease).
#
# Every release carries: one archive per target, install.sh, install.ps1, and
# SHA256SUMS.txt covering all of them. scripts/verify-release-checksums.sh fails
# the run if an asset is missing or extra, before and after publishing.

name: Release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      prod_release:
        description: "Make production release. Leave unchecked to publish the next release candidate."
        type: boolean
        default: false

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    steps:
      - name: Restrict to dpalfery on an allowed ref
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          TRIGGERING_ACTOR="${TRIGGERING_ACTOR:-${ACTOR}}"
          if [[ "${ACTOR}" != "dpalfery" ]] || [[ "${TRIGGERING_ACTOR}" != "dpalfery" ]]
          then
            echo "::error::Only dpalfery may run the Release workflow (actor=${ACTOR}, triggering_actor=${TRIGGERING_ACTOR})."
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${REF}" != "refs/heads/main" ]]
          then
            echo "::error::Run the workflow from main."
            exit 1
          fi

  version:
    name: Resolve version
    needs: [authorize]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Derive version
        id: meta
        env:
          INPUT_PROD_RELEASE: ${{ inputs.prod_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]
          then
            bash scripts/next-release-version.sh --self-test
            if [[ "${INPUT_PROD_RELEASE}" == "true" ]]
            then
              eval "$(bash scripts/next-release-version.sh --prod)"
            else
              eval "$(bash scripts/next-release-version.sh)"
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1 \
              || gh release view "${TAG}" >/dev/null 2>&1
            then
              echo "::error::tag or release ${TAG} already exists. Re-run after the collision is gone."
              exit 1
            fi
            {
              echo "## Releasing \`${TAG}\`"
              if [[ "${INPUT_PROD_RELEASE}" == "true" ]]
              then
                echo "Production release."
              else
                echo "Release candidate."
              fi
              echo
              echo "Builds run first. When they finish, this run waits for the \`release\` environment."
              echo "Click **Review deployments** on this run page, tick \`release\`, then **Approve and deploy**."
              echo "That click publishes \`${TAG}\`."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            TAG="${GITHUB_REF_NAME}"
            RAW="${TAG#v}"
            if [[ ! "${RAW}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            then
              echo "::error::tag '${TAG}' is not valid SemVer (expected vX.Y.Z or vX.Y.Z-prerelease)"
              exit 1
            fi
            VERSION="${RAW}"
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Release version=${VERSION} tag=${TAG}"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # The binary reports this version (`buzz-router --version`), so stamp it before
      # building. Only the first `version = ` line, the [workspace.package] one, changes.
      - name: Stamp version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="${VERSION}" 'BEGIN{d=0} /^version = "/ && !d {print "version = \"" v "\""; d=1; next} {print}' Cargo.toml > Cargo.toml.new
          mv Cargo.toml.new Cargo.toml
          cargo update --workspace
          grep -m1 '^version = ' Cargo.toml

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p buzz-router --bin buzz-router

      # Run the binary where the runner can execute it. x86_64 macOS is cross-built on an
      # Apple silicon runner, so it is skipped.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/buzz-router"
          if [[ "${{ runner.os }}" == "Windows" ]]; then bin="${bin}.exe"; fi
          got="$("${bin}" --version)"
          echo "${got}"
          [[ "${got}" == "buzz-router ${VERSION}" ]] || { echo "::error::expected 'buzz-router ${VERSION}', got '${got}'"; exit 1; }

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="buzz-router-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" buzz-router
          echo "archive=$archive" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $archive = "buzz-router-$env:VERSION-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/buzz-router.exe" -DestinationPath $archive
          "archive=$archive" >> $env:GITHUB_ENV

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buzz-router-${{ matrix.target }}
          path: ${{ env.archive }}
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish release (approval required)
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: buzz-router-*
          merge-multiple: true
          path: release-assets

      # The installers ship as release assets too, so a release can be installed with the
      # exact scripts it was cut with: .../releases/download/<tag>/install.sh
      - name: Add installers and write SHA256SUMS.txt
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cp scripts/install.sh scripts/install.ps1 release-assets/
          bash scripts/verify-release-checksums.sh --write release-assets "${VERSION}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ARGS=(release create "${TAG}" --title "buzz-router ${VERSION}" --generate-notes)
          if [[ "${VERSION}" == *"-"* ]]; then
            ARGS+=(--prerelease)
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            ARGS+=(--target "${TARGET_SHA}")
          fi
          ARGS+=(release-assets/*)
          gh "${ARGS[@]}"

      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "${TAG}" --dir published
          bash scripts/verify-release-checksums.sh --check published "${VERSION}"
          diff -q published/SHA256SUMS.txt release-assets/SHA256SUMS.txt
          echo "published ${TAG}: asset set and checksums verified"
