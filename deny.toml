# cargo-deny policy: known vulnerabilities, licences, sources. Run by the security-scan workflow.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `instant` is unmaintained (a maintenance notice, not a vulnerability). It arrives through
  # nostr 0.44.8, which Buzz pins; revisit when nostr drops it.
  { id = "RUSTSEC-2024-0384", reason = "unmaintained transitive dependency of nostr 0.44; no vulnerability" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "CDLA-Permissive-2.0", # webpki-roots certificate data
  "MPL-2.0", # file-level copyleft only; we link the crates unmodified
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/block/buzz"]
